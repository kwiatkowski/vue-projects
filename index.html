<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151513">
    <meta name="description" content="Strony i aplikacje, którymi się opiekuję.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Projekty</title>
    <!-- the saved theme (dark by default) before the first paint – no flash of the wrong one -->
    <script>var t='dark',c={light:'#f6f5f1','meden-light':'#f5f8fb','meden-dark':'#0e1a2b'};try{var s=localStorage.getItem('projects:theme');if(c[s])t=s}catch(e){}document.documentElement.dataset.theme=t;if(c[t])document.querySelector('meta[name="theme-color"]').setAttribute('content',c[t])</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
